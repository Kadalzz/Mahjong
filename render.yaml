services:
  - type: web
    name: mahjong-club
    runtime: docker
    plan: free
    envVars:
      - key: APP_NAME
        value: "Hóng Zhōng Mahjong"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_LOCALE
        value: id
      - key: APP_FALLBACK_LOCALE
        value: id
      - key: APP_KEY
        sync: false
      - key: APP_URL
        fromService:
          type: web
          name: mahjong-club
          property: host
      - key: LOG_CHANNEL
        value: stack
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: mahjong-club-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: mahjong-club-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: mahjong-club-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: mahjong-club-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: mahjong-club-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: MAIL_MAILER
        value: log
      - key: XENDIT_SECRET_KEY
        sync: false
      - key: XENDIT_CALLBACK_TOKEN
        sync: false
      - key: XENDIT_API_URL
        value: https://api.xendit.co
      - key: ESP32_BRIDGE_MODE
        value: http
      - key: ESP32_BRIDGE_HTTP_URL
        sync: false
      - key: ESP32_BRIDGE_SECRET
        sync: false

databases:
  - name: mahjong-club-db
    plan: free
